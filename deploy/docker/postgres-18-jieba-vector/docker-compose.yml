services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: postgres:18.7-jieba-vector
    container_name: postgres-18-ai
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: aidb
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
