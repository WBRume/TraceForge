<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img">
  <title>TraceForge — Spatial Precision</title>
  <defs>

    <path id="tf-top" d="M25.35 28.9h77.3a10.35 10.35 0 0 1 0 20.7H75.5
      c-6.5 0-10.6 3.6-10.6 9.4v2.5c0 7.9-3.9 10.9-10.4 12.7
      -4 1.1-6.7 2.3-8.2 4.15-.7.85-1.8.4-1.8-.7V49.6H25.35a10.35 10.35 0 0 1 0-20.7Z" />
    <path id="tf-bottom" d="M83.5 62.4h17.3a7.7 7.7 0 0 1 0 15.4H87.5
      c-5 0-8 3-8 7.9v10.5a10.5 10.5 0 0 1-10.5 10.5H55
      a10.5 10.5 0 0 1-10.5-10.5c0-5.4 3.6-8 12.1-10.25
      8.6-2.3 13-6.85 14.5-13.95 1.25-6.35 5.5-9.6 12.4-9.6Z" />

    <clipPath id="clip-top"><use href="#tf-top" /></clipPath>
    <clipPath id="clip-bottom"><use href="#tf-bottom" /></clipPath>


    <linearGradient id="satin-blue" gradientUnits="userSpaceOnUse" x1="24" y1="23" x2="99" y2="104">
      <stop stop-color="#2AADE8" />
      <stop offset=".34" stop-color="#118DD8" />
      <stop offset=".71" stop-color="#0870C8" />
      <stop offset="1" stop-color="#1D51AD" />
    </linearGradient>


    <linearGradient id="top-depth-shadow" gradientUnits="userSpaceOnUse" x1="58" y1="45" x2="64" y2="80">
      <stop offset="0%" stop-color="#0A2540" stop-opacity="0" />
      <stop offset="100%" stop-color="#0A2540" stop-opacity="0.38" />
    </linearGradient>
    <linearGradient id="bottom-depth-shadow" gradientUnits="userSpaceOnUse" x1="78" y1="62" x2="62" y2="96">
      <stop offset="0%" stop-color="#061936" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#0870C8" stop-opacity="0" />
    </linearGradient>


    <radialGradient id="caustic-focus" gradientUnits="userSpaceOnUse" cx="46" cy="40" r="54">
      <stop offset="0%" stop-color="#B9EEFF" stop-opacity="0.58" />
      <stop offset="48%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#1D51AD" stop-opacity="0" />
    </radialGradient>


    <linearGradient id="micro-rim" gradientUnits="userSpaceOnUse" x1="20" y1="26" x2="98" y2="102">
      <stop offset="0%" stop-color="#E0F7FF" stop-opacity="0.85" />
      <stop offset="42%" stop-color="#7DD3FC" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#1D51AD" stop-opacity="0" />
    </linearGradient>
  </defs>


  <g clip-path="url(#clip-top)">
    <rect width="128" height="128" fill="url(#satin-blue)" />

    <rect width="128" height="128" fill="url(#caustic-focus)" />

    <rect width="128" height="128" fill="url(#top-depth-shadow)" />

    <path d="M18 39.25h78c8 0 12 4 12 10" fill="none" stroke="#CBF5FF" stroke-opacity="0.28" stroke-width="6" filter="blur(3px)" />

    <use href="#tf-top" fill="none" stroke="url(#micro-rim)" stroke-width="1.3" />
  </g>


  <g clip-path="url(#clip-bottom)">
    <rect width="128" height="128" fill="url(#satin-blue)" />

    <rect width="128" height="128" fill="url(#bottom-depth-shadow)" />

    <circle cx="88" cy="70" r="24" fill="#7DD3FC" fill-opacity="0.26" filter="blur(4px)" />

    <use href="#tf-bottom" fill="none" stroke="url(#micro-rim)" stroke-width="1.3" />
  </g>
</svg>