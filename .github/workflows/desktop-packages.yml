name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
    paths: ['frontend/**', 'resource-host/**', '.github/workflows/desktop-packages.yml']
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - run: npm ci
      - name: Test desktop integration
        run: npm run test:run -- src/desktop/__tests__ src/utils/__tests__/runtime-api-ws.spec.ts electron/ipc/__tests__/localResources.spec.ts
      - name: Build Tauri NSIS
        run: npm run build:tauri -- --bundles nsis
      - name: Smoke test compiled host
        run: node --test desktop/tests/host.smoke.mjs
      - name: Build Electron NSIS
        run: npm run build:electron -- --win --x64
      - uses: actions/upload-artifact@v4
        with:
          name: TraceForge-desktop-windows-x64
          path: |
            frontend/release/*Setup*.exe
            frontend/src-tauri/target/release/bundle/nsis/*setup.exe
